name: Update TryHackMe Stats

on:
workflow_dispatch:
schedule:
- cron: '0 6 * * *'

jobs:
update-stats:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install jq
    run: |
      sudo apt-get update
      sudo apt-get install -y jq

  - name: Fetch TryHackMe Data
    run: |
      USERNAME="Rupendar"

      curl -sL "https://tryhackme.com/api/v2/public-profile?username=${USERNAME}" -o thm.json

      echo "===== RAW RESPONSE ====="
      cat thm.json
      echo ""
      echo "========================"

      jq empty thm.json

      RANK=$(jq -r '.data.rank' thm.json)
      TOP=$(jq -r '.data.topPercentage' thm.json)
      ROOMS=$(jq -r '.data.completedRoomsNumber' thm.json)
      STREAK=$(jq -r '.data.streak' thm.json)
      BADGES=$(jq -r '.data.badgesNumber' thm.json)
      BADGE_URL=$(jq -r '.data.badgeImageURL' thm.json)

      cat > thm-stats.md << EOF
      ## 🔥 TryHackMe Achievements

      🥇 Rank: $RANK (Top $TOP%)
      🏠 Rooms Completed: $ROOMS
      🔥 Streak: $STREAK days
      🎖 Badges: $BADGES

      ![TryHackMe Badge]($BADGE_URL)
      EOF

      awk '
      /<!-- THM-STATS-START -->/ {
        print
        system("cat thm-stats.md")
        skip=1
        next
      }
      /<!-- THM-STATS-END -->/ {
        skip=0
        print
        next
      }
      !skip
      ' README.md > README.tmp && mv README.tmp README.md

  - name: Commit changes
    run: |
      git config --global user.name "github-actions"
      git config --global user.email "actions@github.com"

      git add README.md

      git diff --cached --quiet && exit 0

      git commit -m "Auto-update TryHackMe stats"
      git push
```
